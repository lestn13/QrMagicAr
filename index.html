<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>QrMagicAr</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="stars"></div>

  <main class="tela">

    <header class="topo">

      <img
        src="assets/logo.png"
        class="logo"
        alt="QrMagicAr"
      >

      <p class="subtitulo">
        Aponte. Descubra. Encante-se.
      </p>

    </header>


    <section class="palco" id="palco">

      <div class="aura"></div>

      <div class="personagem-wrap" id="personagemWrap">

        <img
          id="personagem"
          src="assets/personagem.png"
          class="personagem"
          alt="Personagem mágica"
        >

      </div>

      <div class="magia" id="magia">
        ✦
      </div>

    </section>


    <button
      class="btn-iniciar"
      id="btnIniciar"
    >

      <span>✦</span>

      Começar Experiência

    </button>


    <p
      class="instrucao"
      id="instrucao"
    >

      Mova o cursor pela tela e a personagem acompanhará seus movimentos.

    </p>

  </main>


  <footer>

    © 2026 QrMagicAr. Todos os direitos reservados.

  </footer>


  <script src="script.js"></script>

</body>
</html>
