<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05000d">

    <title>QrMagicAr</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="estrelas"></div>
    <div class="brilho brilho-1"></div>
    <div class="brilho brilho-2"></div>

    <main class="palco" id="palco">

        <!-- CABEÇALHO -->
        <header class="cabecalho">

            <div class="logo-container">
                <img
                    class="logo"
                    src="logo.jpeg"
                    alt="QrMagicAr"
                >
            </div>

            <p class="subtitulo">
                Transforme seus momentos em uma experiência mágica.
            </p>

        </header>


        <!-- ÁREA PRINCIPAL -->
        <section class="experiencia">

            <!-- PERSONAGEM -->
            <div class="personagem-area">

                <div class="circulo-magico"></div>

                <div
                    id="personagemWrap"
                    class="personagem-wrap"
                >

                    <div
                        id="personagem"
                        class="personagem"
                        aria-label="Personagem QrMagicAr"
                    ></div>

                </div>

            </div>


            <!-- TEXTO -->
            <div class="conteudo">

                <h1>
                    Uma nova experiência
                    <span>começa aqui</span>
                </h1>

                <p class="descricao">
                    Dê vida aos seus momentos e descubra
                    uma nova forma de interagir com suas memórias.
                </p>

                <p
                    id="instrucao"
                    class="instrucao"
                >
                    Clique no botão para começar a experiência.
                </p>

                <button
                    id="btnIniciar"
                    class="btn-iniciar"
                    type="button"
                >
                    <span>✦</span>
                    Começar experiência
                </button>

            </div>

        </section>

    </main>


    <footer>
        © 2026 QrMagicAr. Todos os direitos reservados.
    </footer>


    <script src="script.js"></script>

</body>

</html>
