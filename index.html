<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#000000">

    <title>QrMagicAr</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="estrelas"></div>

    <main class="palco" id="palco">

        <header class="cabecalho">

            <div class="logo-wrap">
                <img
                    class="logo"
                    src="logo.jpeg"
                    alt="QrMagicAr"
                >
            </div>

            <h1>QrMagicAr</h1>

            <p class="subtitulo">
                Transforme seus momentos em uma experiência mágica.
            </p>

        </header>


        <section class="experiencia">

            <div
                class="personagem-wrap"
                id="personagemWrap"
            >

                <img
                    id="personagem"
                    class="personagem"
                    src="personagem.jpeg"
                    alt="Personagem"
                >

            </div>


            <div class="conteudo">

                <h2>
                    Uma nova experiência começa aqui
                </h2>

                <p
                    class="instrucao"
                    id="instrucao"
                >
                    Clique no botão para começar a experiência.
                </p>

                <button
                    id="btnIniciar"
                    class="btn-iniciar"
                    type="button"
                >
                    ✦ Começar experiência
                </button>

            </div>

        </section>

    </main>


    <footer>
        © 2026 QrMagicAr. Todos os direitos reservados.
    </footer>


    <script src="script.js"></script>

</body>

</html>
