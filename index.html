<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#000000">

    <title>QrMagicAr</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="estrelas"></div>

    <main class="palco">

        <header class="cabecalho">

            <img
                class="logo"
                src="logo.png"
                alt="QrMagicAr"
            >

            <h1>QrMagicAr</h1>

            <p class="subtitulo">
                Transforme seus momentos em uma experiência mágica.
            </p>

        </header>


        <section class="experiencia">

            <div class="personagem-wrap">

                <img
                    id="personagem"
                    class="personagem"
                    src="personagem.png"
                    alt="Personagem"
                >

            </div>


            <div class="conteudo">

                <h2>
                    Uma nova experiência começa aqui
                </h2>

                <p class="instrucao">
                    Mova o cursor pela tela e a personagem acompanhará seus movimentos.
                </p>

                <button
                    id="btnIniciar"
                    class="btn-iniciar"
                    type="button"
                >
                    Começar experiência
                </button>

            </div>

        </section>

    </main>


    <footer>

        © 2026 QrMagicAr. Todos os direitos reservados.

    </footer>


    <script src="script.js"></script>

</body>

</html>
